services:
  redis:
    image: docker.io/redis:8-alpine
    container_name: poe-redis
    # Config via flags, not a mounted redis.conf: the podman machine on Windows
    # only mounts %USERPROFILE%, so a bind mount from F:\ would fail.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      # BullMQ requires noeviction and warns on every connection otherwise:
      # its jobs, locks and flow links are plain keys, so an eviction under
      # pressure silently drops queue state mid-run. Better to fail writes
      # loudly than to lose an 18h version's worth of work.
      - --maxmemory-policy
      - noeviction
      - --save
      - "900 1"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    image: docker.io/minio/minio:latest
    container_name: poe-minio
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Backing store for the metastore's own schema. Nothing in here is data —
  # only table definitions — but losing it means re-running the DDL.
  metastore-db:
    image: docker.io/postgres:17-alpine
    container_name: poe-metastore-db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - metastore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hive", "-d", "metastore"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Starburst's build rather than apache/hive: it bundles the S3 filesystem jars
  # and takes MinIO config as env vars, so there's no driver jar to mount in.
  metastore:
    image: docker.io/starburstdata/hive:3.1.3-e.15
    container_name: poe-metastore
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://metastore-db:5432/metastore
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive
      # Only used by managed tables; the poe-stuff artifacts are external tables
      # pointed at their own prefix.
      HIVE_METASTORE_WAREHOUSE_DIR: s3://${S3_BUCKET_METADATA:-poe-trade-metadata}/warehouse/
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_PATH_STYLE_ACCESS: "true"
      REGION: ${S3_REGION:-us-east-1}
      # The entrypoint runs `set -u` and `test -v` on every cloud backend it
      # supports, so an unset var kills it with no message. Empty counts as set.
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_WASB_ACCESS_KEY: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
    ports:
      - "127.0.0.1:${METASTORE_PORT:-9083}:9083"
    depends_on:
      metastore-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 6<>/dev/tcp/localhost/9083"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  trino:
    build: ./trino
    container_name: poe-trino
    environment:
      # Referenced as ${ENV:...} from catalog/minio.properties.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${TRINO_PORT:-8080}:8080"
    depends_on:
      metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  redis-data:
  minio-data:
  metastore-db-data:
