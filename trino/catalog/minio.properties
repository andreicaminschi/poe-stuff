connector.name=hive
hive.metastore.uri=thrift://metastore:9083

# Native S3 filesystem (the legacy hive.s3.* properties were removed). Credentials
# come from the container env so changing MINIO_ROOT_USER doesn't require a rebuild.
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
