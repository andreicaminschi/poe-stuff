<title>Filter Tier Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root {
    --ground: #f1f3f4;
    --panel: #ffffff;
    --panel-2: #e9ebec;
    --ink: #1a1614;
    --ink-2: #5f574f;
    --ink-3: #8b8178;
    --line: #d9d5d0;
    --accent: #af6025;
    --accent-soft: #f0e2d5;

    /* Tier owns colour. Nine steps, each nameable on sight, dark enough for a white
       panel — the stage has its own brighter set, since it paints on near-black. */
    --t-0: #c62a45;
    --t-1: #a86200;
    --t-2: #7d6b00;
    --t-3: #2e7a37;
    --t-4: #1e6a9c;
    --t-5: #4f5b8f;
    --t-6: #5c666e;
    --t-varies: #9c3a95;
    --t-hidden: #9a9086;

    /* The preview is a window into the game, so it keeps its ground in both themes. */
    --game: #0a0908;
    --game-line: #241e1a;
    --game-ink: #b9ada2;
    --game-take: #e0a64b;
    --game-check: #58a7c8;
    --game-gamble: #c8452f;

    --sp: 4px;
    --radius: 3px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14100e;
      --panel: #1d1815;
      --panel-2: #262019;
      --ink: #f0eae4;
      --ink-2: #a2968c;
      --ink-3: #766c63;
      --line: #2e2621;
      --accent: #d08a47;
      --accent-soft: #33241a;

      --t-0: #ff3d5a;
      --t-1: #ff9f2e;
      --t-2: #ffe14d;
      --t-3: #7ddc6a;
      --t-4: #4ea8de;
      --t-5: #8f9fd0;
      --t-6: #7e8a94;
      --t-varies: #d67fd0;
      --t-hidden: #6b615a;
    }
  }

  :root[data-theme="dark"] {
    --ground: #14100e;
    --panel: #1d1815;
    --panel-2: #262019;
    --ink: #f0eae4;
    --ink-2: #a2968c;
    --ink-3: #766c63;
    --line: #2e2621;
    --accent: #d08a47;
    --accent-soft: #33241a;

    --t-0: #ff3d5a;
    --t-1: #ff9f2e;
    --t-2: #ffe14d;
    --t-3: #7ddc6a;
    --t-4: #4ea8de;
    --t-5: #8f9fd0;
    --t-6: #7e8a94;
    --t-varies: #d67fd0;
    --t-hidden: #6b615a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  h1, h2, h3 { text-wrap: balance; margin: 0; }

  .eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */

  .top {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: calc(var(--sp) * 4);
    padding: calc(var(--sp) * 4) calc(var(--sp) * 6);
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  .top h1 {
    font-family: Alegreya, Georgia, serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .top .count { color: var(--ink-2); font-size: 13px; }
  .top .count b { color: var(--ink); font-weight: 600; }
  .spacer { flex: 1 1 auto; }

  .shell {
    display: grid;
    grid-template-columns: 310px minmax(0, 1fr);
    gap: calc(var(--sp) * 5);
    padding: calc(var(--sp) * 5) calc(var(--sp) * 6);
    align-items: start;
  }

  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    /* Stacked, the rail is just another block: no pinning, no inner scroller. */
    .rail { position: static; max-height: none; overflow: visible; padding-right: 0; }
  }

  .rail {
    position: sticky;
    top: 74px;
    display: flex;
    flex-direction: column;
    gap: calc(var(--sp) * 4);
    /* Taller than the viewport, the rail has to scroll on its own — pinned without this,
       its lower cards are unreachable until the whole page scrolls past them. */
    max-height: calc(100vh - 74px - calc(var(--sp) * 5));
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-right: calc(var(--sp) * 2);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: calc(var(--sp) * 4);
    display: flex;
    flex-direction: column;
    gap: calc(var(--sp) * 3);
  }

  /* ---------- matrix ---------- */

  .matrix { width: 100%; border-collapse: collapse; font-size: 12px; }
  .matrix th { font-weight: 600; color: var(--ink-3); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 0 calc(var(--sp) * 2); }
  .matrix td { padding: 0; }
  .matrix th:first-child { text-align: left; }

  .cell {
    width: 100%;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: var(--panel-2);
    color: var(--ink);
    font: inherit;
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    padding: calc(var(--sp) * 1.5) 0;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .cell:hover { background: var(--accent-soft); }
  .cell[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cell[data-empty="1"] { color: var(--ink-3); background: transparent; }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .tier-label {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    color: var(--ink-2);
    padding-right: calc(var(--sp) * 2);
    white-space: nowrap;
  }

  /* The rail names a tier in the same colour the stage draws it in. One class per tier
     rather than an inline style, so the light and dark values swap with the theme. */
  .t-T0 { color: var(--t-0); }
  .t-T1 { color: var(--t-1); }
  .t-T2 { color: var(--t-2); }
  .t-T3 { color: var(--t-3); }
  .t-T4 { color: var(--t-4); }
  .t-T5 { color: var(--t-5); }
  .t-T6 { color: var(--t-6); }
  .t-varies { color: var(--t-varies); }
  .t-hidden { color: var(--t-hidden); }

  /* `.matrix th` carries a colour of its own and outranks a lone class, so the row
     headers take the tier ink through a selector that outranks it back. */
  .matrix th.t-T0 { color: var(--t-0); }
  .matrix th.t-T1 { color: var(--t-1); }
  .matrix th.t-T2 { color: var(--t-2); }
  .matrix th.t-T3 { color: var(--t-3); }
  .matrix th.t-T4 { color: var(--t-4); }
  .matrix th.t-T5 { color: var(--t-5); }
  .matrix th.t-T6 { color: var(--t-6); }
  .matrix th.t-varies { color: var(--t-varies); }
  .matrix th.t-hidden { color: var(--t-hidden); }

  /* ---------- controls ---------- */

  label.field { display: flex; flex-direction: column; gap: calc(var(--sp) * 1.5); }

  input[type="search"], select {
    width: 100%;
    padding: calc(var(--sp) * 2);
    background: var(--ground);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font: inherit;
  }
  input[type="search"]:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .switch { display: flex; align-items: center; gap: calc(var(--sp) * 2); cursor: pointer; }
  .switch input { accent-color: var(--accent); width: 15px; height: 15px; }

  /* Families: every one on by default, uncheck to drop it from the board. */
  .checks { display: flex; flex-direction: column; gap: calc(var(--sp) * 0.5); }

  .check {
    display: grid;
    grid-template-columns: 15px minmax(0, 1fr) auto;
    align-items: center;
    gap: calc(var(--sp) * 2);
    padding: calc(var(--sp) * 0.5) 0;
    cursor: pointer;
  }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .check span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .check .n {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--ink-3);
  }
  .check:has(input:not(:checked)) span,
  .check:has(input:not(:checked)) .n { color: var(--ink-3); text-decoration: line-through; }

  .link {
    background: none;
    border: 0;
    padding: 0 0 0 calc(var(--sp) * 2);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    cursor: pointer;
  }
  .link:hover { text-decoration: underline; }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .reset {
    align-self: flex-start;
    background: none;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    padding: calc(var(--sp) * 1.5) calc(var(--sp) * 3);
    cursor: pointer;
  }
  .reset:hover { border-color: var(--accent); color: var(--accent); }
  .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- the game viewport ---------- */

  .stage {
    background: var(--game);
    border: 1px solid var(--game-line);
    border-radius: var(--radius);
    padding: calc(var(--sp) * 5) calc(var(--sp) * 4);
    min-height: 60vh;
  }

  .stage-head {
    display: flex;
    align-items: baseline;
    gap: calc(var(--sp) * 3);
    padding-bottom: calc(var(--sp) * 4);
    margin-bottom: calc(var(--sp) * 4);
    border-bottom: 1px solid var(--game-line);
  }
  .stage-head .eyebrow { color: #6d6259; }

  .drops { display: flex; flex-direction: column; align-items: stretch; gap: calc(var(--sp) * 2); }

  /* One drop: tier badge, minimap icon, the label plate, then the numbers. */
  .drop {
    display: grid;
    grid-template-columns: 50px 26px minmax(0, auto) 1fr;
    align-items: center;
    gap: calc(var(--sp) * 3);
    width: 100%;
    padding: 1px 0;
    animation: settle 220ms ease both;
  }

  /* ---------- the tier badge ---------- */

  /* Redundant with the plate's colour and size on purpose: the tier is the question the
     board exists to answer, and reading it should never mean comparing two rows. */
  .badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    border: 1px solid;
    border-radius: 2px;
    padding: 1px 0 2px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1.1;
  }

  .pips { display: flex; gap: 2px; height: 3px; }
  .pips i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
  .pips i.off { opacity: 0.22; }

  /* ---------- the tier band ---------- */

  .band {
    position: sticky;
    /* Under the page header, which is sticky too — without this the band slides beneath
       it and the tier being read scrolls away unlabelled. */
    top: 65px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: calc(var(--sp) * 3);
    margin: calc(var(--sp) * 5) 0 calc(var(--sp) * 1);
    padding: calc(var(--sp) * 1.5) 0;
    background: var(--game);
    color: var(--band);
  }
  .band:first-child { margin-top: 0; }

  .band .badge { flex-direction: row; align-items: baseline; padding: 1px 6px; gap: 5px; }
  .band .pips { align-self: center; }

  .band-name {
    font-family: Alegreya, Georgia, serif;
    font-size: 16px;
    font-weight: 700;
  }
  .band-says { color: #6d6259; font-size: 11px; }
  .band-rule { flex: 1; height: 1px; background: currentColor; opacity: 0.28; }
  .band-n {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: #6d6259;
  }

  @keyframes settle { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .drop { animation: none; } }

  .icon { display: block; margin: 0 auto; }

  .plate {
    display: inline-flex;
    align-items: baseline;
    gap: calc(var(--sp) * 2);
    font-family: Alegreya, Georgia, serif;
    font-weight: 700;
    line-height: 1.15;
    padding: 2px 10px;
    border: 1px solid;
    border-radius: 2px;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .plate .base { font-weight: 500; opacity: 0.72; font-size: 0.82em; }
  /* Level and quality ride with the name, in the plate's own ink but quieter than it. */
  .plate .lq { font-weight: 600; opacity: 0.6; font-size: 0.8em; font-variant-numeric: tabular-nums; }

  .meta {
    display: flex;
    align-items: baseline;
    gap: calc(var(--sp) * 3);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: #6d6259;
    min-width: 0;
  }
  .meta .price { color: #9a8d81; }
  .meta .tag {
    border: 1px solid #342c26;
    border-radius: 2px;
    padding: 0 5px;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  /* The action, said twice over: the glyph repeats the minimap icon's shape, and the
     plate beside it wears the matching border style. Colour is spent on the tier. */
  .meta .verb {
    border: 1px solid #342c26;
    border-radius: 2px;
    padding: 0 5px;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #9a8d81;
  }
  .meta .verb::before { margin-right: 4px; }
  .meta .verb.take::before { content: "\25CF"; }
  .meta .verb.check::before { content: "\25C6"; }
  .meta .verb.gamble::before { content: "\25B2"; }

  .meta .tag.vaal { color: var(--game-gamble); border-color: #4a221a; }
  .meta .tag.thin { color: #6d6259; }
  /* The game's own corrupted red, which is the one colour a player already reads. */
  .meta .tag.corrupted { color: #d02020; border-color: #4a1414; }
  /* Priced by the Currency Exchange, not by a scraped listing. */
  .meta .tag.exchange { color: var(--game-check); border-color: #1e3540; }
  .meta .note { color: #574e47; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Filter lines the bucket carries literally, because nothing here could derive them.
     Count only — the lines themselves are on the title, being the one thing in a row that
     is already code rather than prose. */
  .meta .cond { color: var(--game-check); border: 1px solid #1e3540; border-radius: 2px; padding: 0 3px; white-space: nowrap; }
  /* What actually decided the tier — the reason the row looks the way it does. */
  /* Truncates rather than pushing the row wide: a variant and a corrupted implicit make
     this the longest thing in the line, and the full text is on the element's title. */
  .meta .set-by { color: #8a7d70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .meta .set-by em { color: #574e47; font-style: normal; }

  .more {
    margin-top: calc(var(--sp) * 5);
    background: none;
    border: 1px dashed var(--game-line);
    border-radius: var(--radius);
    color: var(--game-ink);
    font: inherit;
    font-size: 12px;
    padding: calc(var(--sp) * 2) calc(var(--sp) * 5);
    cursor: pointer;
  }
  .more:hover { border-color: var(--game-take); color: var(--game-take); }
  .more:focus-visible { outline: 2px solid var(--game-take); outline-offset: 2px; }

  .empty { color: #6d6259; font-size: 13px; padding: calc(var(--sp) * 8) 0; }

  /* ---------- legend ---------- */

  .legend-grid { display: flex; flex-direction: column; gap: calc(var(--sp) * 2); }
  .legend-row { display: flex; align-items: center; gap: calc(var(--sp) * 3); }
  .legend-row .tier-label { min-width: 46px; padding: 0; }
  .legend-row .rule { flex: 1; height: 1px; background: var(--line); }
  /* Badge on a white panel: it borrows the row's tier colour rather than carrying a
     wash, which at these sizes would only muddy the ink. */
  .legend-row .badge { min-width: 44px; border-color: currentColor; background: none; }
  .legend-says { color: var(--ink-3); font-size: 11px; }
  .legend-word { font-size: 12px; min-width: 46px; color: var(--ink-2); }

  /* The plate's border style, at plate weight, so the key matches what the stage draws. */
  .legend-sample {
    font-family: Alegreya, Georgia, serif;
    font-weight: 700;
    font-size: 12px;
    color: var(--ink-3);
    border: 1px solid var(--ink-3);
    border-radius: 2px;
    padding: 0 6px;
  }
  .legend-sample.check { border-style: dashed; }
  .legend-sample.gamble { border-style: double; border-width: 3px; }
</style>

<div class="top">
  <h1>Filter Tier Board</h1>
  <span class="count"><b id="shown">0</b> of <b id="total">0</b> buckets</span>
  <span class="spacer"></span>
  <span class="eyebrow" id="stamp"></span>
</div>

<div class="shell">
  <aside class="rail">
    <section class="card">
      <span class="eyebrow">Tier &times; verb</span>
      <table class="matrix">
        <thead>
          <tr>
            <th scope="col"></th>
            <th scope="col">&#9679; take</th>
            <th scope="col">&#9670; check</th>
            <th scope="col">&#9650; gamble</th>
          </tr>
        </thead>
        <tbody id="matrix-body"></tbody>
      </table>
      <button class="reset" type="button" id="reset">Clear filters</button>
    </section>

    <section class="card">
      <span class="eyebrow">Filter</span>
      <label class="field">
        <span class="eyebrow">Search</span>
        <input type="search" id="q" placeholder="Headhunter, Moonstone Ring, gem&hellip;">
      </label>
      <div class="field">
        <span class="eyebrow">
          Families
          <button class="link" type="button" id="fam-all">all</button>
          <button class="link" type="button" id="fam-none">none</button>
        </span>
        <div class="checks" id="families"></div>
      </div>
      <label class="switch"><input type="checkbox" id="hide-thin"> <span>Hide thin buckets</span></label>
    </section>

    <section class="card">
      <span class="eyebrow">Tiers &mdash; colour, size, pips</span>
      <div class="legend-grid" id="legend-tiers"></div>
    </section>

    <section class="card">
      <span class="eyebrow">Actions &mdash; shape, border</span>
      <div class="legend-grid" id="legend-verbs"></div>
    </section>
  </aside>

  <main>
    <section class="stage">
      <div class="stage-head">
        <span class="eyebrow">Drop preview</span>
        <span class="eyebrow" id="stage-sub"></span>
      </div>
      <div class="drops" id="drops"></div>
      <button class="more" type="button" id="more" hidden>Show more</button>
    </section>
  </main>
</div>

<script>
  const BUCKETS = /*__BUCKETS__*/[];
  const GENERATED = "/*__STAMP__*/";

  const TIERS = ["T0", "T1", "T2", "T3", "T4", "T5", "T6", "varies", "hidden"];
  const VERBS = ["take", "check", "gamble"];

  /**
   * How each tier draws.
   *
   * Four redundant channels, because one is never enough to read a rung off a single
   * row: `ink` is the tier's own colour, `size` and `glow` its loudness, `pips` the rung
   * counted out, and `badge` the rung written down. The inks are the dark half of the
   * `--t-*` ramp — the stage is near-black in either theme, so it never takes the light
   * set the rail uses.
   */
  const TIER = {
    T0:     { ink: "#ff3d5a", size: 26,   glow: 18, wash: 0.24, isz: 11,  pips: 7, beam: true,  badge: "T0",  name: "tier 0", says: "stop what you are doing" },
    T1:     { ink: "#ff9f2e", size: 21,   glow: 11, wash: 0.18, isz: 9.5, pips: 6, beam: true,  badge: "T1",  name: "tier 1", says: "worth crossing the map for" },
    T2:     { ink: "#ffe14d", size: 17.5, glow: 0,  wash: 0.13, isz: 8,   pips: 5, beam: false, badge: "T2",  name: "tier 2", says: "pick up on the way past" },
    T3:     { ink: "#7ddc6a", size: 15,   glow: 0,  wash: 0.09, isz: 7,   pips: 4, beam: false, badge: "T3",  name: "tier 3", says: "pick up when convenient" },
    T4:     { ink: "#4ea8de", size: 13.5, glow: 0,  wash: 0.05, isz: 6,   pips: 3, beam: false, badge: "T4",  name: "tier 4", says: "shown, rarely worth the click" },
    // The bottom two are not "quieter than T4", they are the smallest marks the game can
    // draw for something that must appear anyway — hence the cool hues off the heat ramp.
    T5:     { ink: "#8f9fd0", size: 12,   glow: 0,  wash: 0.03, isz: 5,   pips: 2, beam: false, badge: "T5",  name: "tier 5", says: "always shown: crafting mats" },
    T6:     { ink: "#7e8a94", size: 11,   glow: 0,  wash: 0.02, isz: 4,   pips: 1, beam: false, badge: "T6",  name: "tier 6", says: "always shown: floor sweepings" },
    // Off the ladder: no rung to count, so no pips, and a hue that is not on the ramp.
    // It makes no loudness claim either, so it borrows T3's size and nothing else.
    varies: { ink: "#d67fd0", size: 15,   glow: 0,  wash: 0.09, isz: 7,   pips: 0, beam: false, badge: "VAR", name: "varies", says: "price depends on the roll" },
    hidden: { ink: "#6b615a", size: 11.5, glow: 0,  wash: 0.02, isz: 0,   pips: 0, beam: false, badge: "HID", name: "hidden", says: "the game never draws it" }
  };

  /**
   * How each action draws — in every channel except colour, which the tier has taken.
   *
   * `shape` is the minimap glyph, `border` the style the plate's own frame wears. A row
   * says its verb three times: icon, plate frame, and the word in the meta line.
   */
  const VERB = {
    take:   { border: "solid",  width: 1, says: "grab it off the ground" },
    check:  { border: "dashed", width: 1, says: "hover it, the roll decides" },
    gamble: { border: "double", width: 3, says: "vaal it and hope" }
  };

  // `hidden` holds the families switched off, so a family added by a later run of the
  // classifier shows up rather than needing to be opted in.
  const state = { tier: null, verb: null, hidden: new Set(), q: "", hideThin: false, limit: 120 };

  const $ = (id) => document.getElementById(id);
  const chaos = (n) => (n >= 1000 ? Math.round(n / 1000) + "k" : Math.round(n)) + "c";

  /** Two hex digits of alpha, for the washes a plate is tinted with. */
  const alpha = (n) => Math.round(Math.max(0, Math.min(255, n))).toString(16).padStart(2, "0");

  /** The tier as a count: filled to its rung, hollow to six. Nothing for the two that
      sit off the ladder — a rung they do not have should not be drawn as zero. */
  function pips(tier) {
    if (TIER[tier].pips === 0) return "";
    let out = '<span class="pips">';
    for (let i = 0; i < 7; i += 1) out += '<i class="' + (i < TIER[tier].pips ? "on" : "off") + '"></i>';
    return out + "</span>";
  }

  /** The chip that opens every row and every band: the tier written down, then counted. */
  function badge(tier) {
    const t = TIER[tier];
    return '<span class="badge" style="color:' + t.ink + ';border-color:' + t.ink +
      '66;background:' + t.ink + '14">' + t.badge + pips(tier) + '</span>';
  }

  /**
   * What one bucket is, as the classifier decided it.
   *
   * The page used to re-tier here against a client-side vaal cap, mirroring the cuts in
   * `classify.ts` so the two could agree. They cannot agree any more — the cuts are
   * denominated in divine now and the vaal expectation is gone — and a board that
   * re-derives a tier the generator did not produce is showing a filter nobody will get.
   * Levers are set, and the filter regenerated. This just reads.
   */
  function resolve(b) {
    return { tier: b.tier, verb: b.verb, vaalable: b.vc > 0 && b.verb === "gamble" };
  }

  /**
   * The minimap glyph: the verb's shape, drawn at the tier's size in the tier's colour.
   *
   * One mark carrying both dimensions is the point — the shape answers "what do I do"
   * and the colour and size answer "how much do I care", without two things to compare.
   * `paint` overrides the ink for the legend, which sits on a panel rather than the
   * stage and needs the theme's own foreground.
   */
  function icon(verb, tier, paint) {
    const t = TIER[tier];
    const size = t.isz, beam = t.beam;
    if (size <= 0) return '<svg class="icon" width="26" height="16"></svg>';
    const ink = paint || t.ink;
    const c = 13, m = 8, s = size / 2;
    // Shape says the verb: a disc to take, a diamond to hover, a triangle to gamble.
    const shape = verb === "take"
      ? '<circle cx="' + c + '" cy="' + m + '" r="' + s + '" fill="' + ink + '"/>'
      : verb === "check"
        ? '<path d="M' + c + ' ' + (m - s) + 'L' + (c + s) + ' ' + m + 'L' + c + ' ' + (m + s) + 'L' + (c - s) + ' ' + m + 'Z" fill="' + ink + '"/>'
        : '<path d="M' + c + ' ' + (m - s) + 'L' + (c + s * 0.92) + ' ' + (m + s * 0.8) + 'L' + (c - s * 0.92) + ' ' + (m + s * 0.8) + 'Z" fill="' + ink + '"/>';
    const glow = beam ? '<rect x="' + (c - 0.75) + '" y="0" width="1.5" height="16" fill="' + ink + '" opacity="0.35"/>' : '';
    return '<svg class="icon" width="26" height="16" viewBox="0 0 26 16" aria-hidden="true">' + glow + shape + '</svg>';
  }

  /**
   * A gem's level, quality and corruption, as the classifier spelled them into the id.
   *
   * They belong on the plate as their own marks rather than inside the item's name: a
   * filter block reads level and quality as conditions, and a player reads corruption as
   * the thing that makes the gem worth what it is worth. Buckets without the suffix — a
   * transfigured gem, a unique base, an orb — come back with nothing and print nothing.
   */
  const GEM_STATE = / lvl(\d+) q(\d+)( corrupted)?$/;

  function label(name) {
    const cut = name.indexOf(":");
    const kind = cut < 0 ? "" : name.slice(0, cut);
    let rest = cut < 0 ? name : name.slice(cut + 1);

    const state = GEM_STATE.exec(rest);
    if (!state) return { kind, rest, lq: "", corrupted: false };

    rest = rest.slice(0, state.index);
    return { kind, rest, lq: state[1] + "/" + state[2], corrupted: Boolean(state[3]) };
  }

  function render() {
    const q = state.q.trim().toLowerCase();
    const rows = [];
    let vaalable = 0;

    for (const b of BUCKETS) {
      const now = resolve(b);
      if (now.vaalable) vaalable += 1;

      if (state.tier && now.tier !== state.tier) continue;
      if (state.verb && now.verb !== state.verb) continue;
      if (state.hidden.has(b.fam)) continue;
      if (state.hideThin && b.th) continue;
      // Searching the driver too: "Headhunter" should find the belt bucket it tiers.
      if (q && !(b.id.toLowerCase().includes(q) || b.sb.toLowerCase().includes(q) || (b.ex[0] || "").toLowerCase().includes(q))) continue;
      rows.push([b, now]);
    }

    $("shown").textContent = rows.length.toLocaleString();
    $("stage-sub").textContent = vaalable.toLocaleString() + " gambles";

    // Counts on the matrix follow the lever too, so the grid is never stale.
    for (const tier of TIERS) {
      for (const verb of VERBS) {
        const cell = document.querySelector('[data-tier="' + tier + '"][data-verb="' + verb + '"]');
        if (!cell) continue;
        // The grid counts what is on the board, so switching a family off empties its
        // cells rather than leaving a number nothing below it accounts for.
        let n = 0;
        for (const b of BUCKETS) {
          if (state.hidden.has(b.fam)) continue;
          const now = resolve(b);
          if (now.tier === tier && now.verb === verb) n += 1;
        }
        cell.textContent = n === 0 ? "·" : n.toLocaleString();
        cell.dataset.empty = n === 0 ? "1" : "0";
        cell.setAttribute("aria-pressed", String(state.tier === tier && state.verb === verb));
      }
    }

    const stage = $("drops");
    stage.textContent = "";

    if (rows.length === 0) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Nothing matches. Clear a filter.";
      stage.append(p);
      $("more").hidden = true;
      return;
    }

    // Grouped by tier, loudest first, and by price inside a tier — so a band opens with
    // the item that set it and the ladder reads straight down the page.
    const top = ([b]) => Math.max(b.ce, b.fl);
    rows.sort((a, b) => (TIERS.indexOf(a[1].tier) - TIERS.indexOf(b[1].tier)) || (top(b) - top(a)));

    // Counted over every match rather than the slice, so a band header does not shrink
    // just because "show more" is the only thing between it and the rest of its tier.
    const perTier = new Map();
    for (const row of rows) perTier.set(row[1].tier, (perTier.get(row[1].tier) ?? 0) + 1);

    const slice = rows.slice(0, state.limit);
    let open = null;

    const html = slice.map(([b, now]) => {
      const t = TIER[now.tier];
      const v = VERB[now.verb];
      const ink = t.ink;
      const { kind, rest, lq, corrupted } = label(b.id);
      const price = b.ce >= b.fl ? chaos(b.ce) : chaos(b.fl);

      // A band opens each run of one tier and sticks under the header while it scrolls,
      // so the rung is on screen for every row beneath it.
      let head = "";
      if (now.tier !== open) {
        open = now.tier;
        head = '<div class="band" style="--band:' + ink + '">' + badge(now.tier) +
          '<span class="band-name">' + t.name + '</span>' +
          '<span class="band-says">' + t.says + '</span>' +
          '<span class="band-rule"></span>' +
          '<span class="band-n">' + perTier.get(now.tier).toLocaleString() + '</span>' +
        '</div>';
      }

      return head + '<div class="drop">' +
        badge(now.tier) +
        icon(now.verb, now.tier) +
        '<span class="plate" style="font-size:' + t.size + 'px;color:' + ink +
          ';border-style:' + v.border + ';border-width:' + v.width + 'px' +
          ';border-color:' + ink + alpha(t.wash * 255 + 40) +
          ';background:' + ink + alpha(t.wash * 90) +
          (t.glow ? ';text-shadow:0 0 ' + t.glow + 'px ' + ink + '66' : '') + '">' +
          '<span>' + rest + '</span>' +
          (lq ? '<span class="lq">' + lq + '</span>' : '') +
          (kind ? '<span class="base">' + kind + '</span>' : '') +
        '</span>' +
        '<span class="meta">' +
          '<span class="verb ' + now.verb + '">' + now.verb + '</span>' +
          '<span class="price">' + price + '</span>' +
          (now.vaalable ? '<span class="tag vaal">vaal ' + chaos(b.vc) + '</span>' : '') +
          (corrupted ? '<span class="tag corrupted">corrupted</span>' : '') +
          (b.th ? '<span class="tag thin">thin</span>' : '') +
          (b.xf ? '<span class="tag exchange">exchange</span>' : '') +
          '<span class="set-by" title="' + b.sb.replaceAll('"', "&quot;") + '"><em>set by</em> ' + b.sb + '</span>' +
          '<span class="note">' + b.note + '</span>' +
          (b.cond.length ? '<span class="cond" title="' + b.cond.join("\n").replaceAll('"', "&quot;") + '">' + b.cond.length + ' verbatim</span>' : '') +
        '</span>' +
      '</div>';
    }).join("");

    stage.innerHTML = html;
    $("more").hidden = rows.length <= state.limit;
    $("more").textContent = "Show more (" + (rows.length - state.limit).toLocaleString() + " left)";
  }

  function buildMatrix() {
    const body = $("matrix-body");
    for (const tier of TIERS) {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.scope = "row";
      // Same colour the stage paints the tier in, so the rail and the board agree.
      th.className = "tier-label t-" + tier;
      th.textContent = tier;
      tr.append(th);

      for (const verb of VERBS) {
        const td = document.createElement("td");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cell";
        button.dataset.tier = tier;
        button.dataset.verb = verb;
        button.setAttribute("aria-pressed", "false");
        button.addEventListener("click", () => {
          const on = state.tier === tier && state.verb === verb;
          state.tier = on ? null : tier;
          state.verb = on ? null : verb;
          state.limit = 120;
          render();
        });
        td.append(button);
        tr.append(td);
      }
      body.append(tr);
    }
  }

  /**
   * Two keys, because the board says two things at once now.
   *
   * The tier key is drawn in the theme's colours rather than the stage's, since it sits
   * on a panel — the badge picks the row's tier up through `currentColor`. The action
   * key never names a tier: it shows the shape and the plate's frame, nothing else.
   */
  function buildLegend() {
    const tiers = $("legend-tiers");
    for (const tier of TIERS) {
      const t = TIER[tier];
      const row = document.createElement("div");
      row.className = "legend-row t-" + tier;
      row.innerHTML = '<span class="badge">' + t.badge + pips(tier) + '</span>' +
        '<span class="legend-word">' + t.name + '</span>' +
        '<span class="legend-says">' + t.says + '</span>';
      tiers.append(row);
    }

    const verbs = $("legend-verbs");
    for (const verb of VERBS) {
      const row = document.createElement("div");
      row.className = "legend-row";
      // Drawn at T2's size: big enough to tell three shapes apart, and making no claim
      // about which rung the shape belongs to.
      row.innerHTML = icon(verb, "T2", "var(--ink-2)") +
        '<span class="legend-word">' + verb + '</span>' +
        '<span class="legend-sample ' + verb + '">plate</span>' +
        '<span class="legend-says">' + VERB[verb].says + '</span>';
      verbs.append(row);
    }
  }

  function buildFamilies() {
    const counts = new Map();
    for (const b of BUCKETS) counts.set(b.fam, (counts.get(b.fam) ?? 0) + 1);

    const box = $("families");
    // Biggest first: the families worth switching off are the ones filling the board.
    for (const [family, count] of [...counts].sort((a, b) => b[1] - a[1])) {
      const row = document.createElement("label");
      row.className = "check";

      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = true;
      input.dataset.family = family;
      input.addEventListener("change", () => {
        if (input.checked) state.hidden.delete(family);
        else state.hidden.add(family);
        state.limit = 120;
        render();
      });

      const name = document.createElement("span");
      name.textContent = family;

      const n = document.createElement("span");
      n.className = "n";
      n.textContent = count.toLocaleString();

      row.append(input, name, n);
      box.append(row);
    }
  }

  /** Tick or untick every family at once. */
  function setAllFamilies(on) {
    for (const input of document.querySelectorAll("#families input")) {
      input.checked = on;
      if (on) state.hidden.delete(input.dataset.family);
      else state.hidden.add(input.dataset.family);
    }
    state.limit = 120;
    render();
  }

  buildMatrix();
  buildLegend();
  buildFamilies();

  $("total").textContent = BUCKETS.length.toLocaleString();
  $("stamp").textContent = GENERATED;

  $("q").addEventListener("input", (e) => { state.q = e.target.value; state.limit = 120; render(); });
  $("fam-all").addEventListener("click", () => setAllFamilies(true));
  $("fam-none").addEventListener("click", () => setAllFamilies(false));
  $("hide-thin").addEventListener("change", (e) => { state.hideThin = e.target.checked; render(); });
  $("more").addEventListener("click", () => { state.limit += 240; render(); });
  $("reset").addEventListener("click", () => {
    state.tier = null; state.verb = null; state.q = ""; state.hideThin = false; state.limit = 120;
    $("q").value = ""; $("hide-thin").checked = false;
    setAllFamilies(true);
  });

  render();
</script>
